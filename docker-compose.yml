services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://loom:loom@postgres:5432/loom
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_MODE: ${AUTH_MODE:-stub}
      STUB_AUTH_TOKEN: ${STUB_AUTH_TOKEN:-loom-dev-token}
      JWT_SECRET: ${JWT_SECRET:-loom-dev-jwt-secret}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-HS256}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Defaults to the offline heuristic classifier. Set AI_PROVIDER=claude|openai
      # and the matching key in a local .env for real classification.
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_API_KEY: ${AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-stub}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # One consumer group member. Scale with `docker compose up --scale worker=N`
  # only after Redis is healthy; each replica claims idle entries via XAUTOCLAIM.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://loom:loom@postgres:5432/loom
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_MODE: ${AUTH_MODE:-stub}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_API_KEY: ${AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-stub}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        # Waits for the backend so migrations have run before the first write.
        condition: service_started
    volumes:
      - ./backend:/app
    command: python -m app.worker
    restart: unless-stopped

  dashboard:
    build:
      # Root context: the dashboard imports ../shared, which a ./dashboard
      # context would leave out of the image.
      context: .
      dockerfile: ./dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Server-side only. The dashboard fetches from server components, so the
      # token is never sent to the browser and needs no NEXT_PUBLIC_ prefix.
      # Reached over the compose network, not localhost.
      LOOM_API_URL: http://backend:8000
      # Stub-only fallback when Clerk keys are absent (local). Production must use Clerk.
      LOOM_API_TOKEN: ${LOOM_API_TOKEN:-loom-dev-token}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app/dashboard
      - ./shared:/app/shared
      - /app/dashboard/node_modules
      - /app/dashboard/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
